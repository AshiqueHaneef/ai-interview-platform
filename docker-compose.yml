# Reads variables from ./.env (copy .env.example to .env); defaults below match it.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-interview}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-interview}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  ai-service:
    build: ./ai-service
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"

  gateway:
    build: ./gateway
    environment:
      PORT: "3001"
      # In-network URLs — service names, not the localhost values from gateway/.env
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-interview}
      AI_SERVICE_URL: http://ai-service:8000
    ports:
      - "${GATEWAY_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - gateway

volumes:
  pgdata:
